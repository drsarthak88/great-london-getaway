<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#3fb6ff" />
    <meta name="description" content="Marmalade Jack has pinched the Golden Teapot! A bright storybook endless runner through London." />
    <!-- Add to Home Screen: full-screen on iPhone/iPad and Android. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="London Getaway" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <title>The Great London Getaway</title>
    <style>
      /* Instant splash, shown before any JavaScript loads. */
      #splash {
        position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(#3fb6ff, #fff0b8); font-family: Georgia, serif; color: #2b2118;
        transition: opacity 0.45s;
      }
      #splash.splash-out { opacity: 0; pointer-events: none; }
      #splash h1 { margin: 0; font-size: clamp(28px, 7vw, 56px); color: #e63946; text-align: center;
        text-shadow: 2px 2px 0 #ffd23a, 4px 4px 0 #2b2118; padding: 0 16px; }
      #splash .pot { width: 64px; height: 52px; border-radius: 50% 50% 45% 45%; background: #f0b429;
        border: 4px solid #2b2118; animation: splash-bob 0.9s ease-in-out infinite alternate; }
      #splash p { margin: 0; font-style: italic; }
      @keyframes splash-bob { to { transform: translateY(-10px) rotate(-8deg); } }
      @media (prefers-reduced-motion: reduce) { #splash .pot { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="Game view"></canvas>
      <div id="ui-root"></div>
      <div id="paper-grain" aria-hidden="true"></div>
    </div>
    <div id="splash" role="status"><div class="pot" aria-hidden="true"></div><h1>The Great London Getaway</h1><p>Polishing the teapot…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
